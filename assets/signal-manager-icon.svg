<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon app Signal Manager — squircle chuẩn macOS, vịt bơi + sóng tín hiệu -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A76F0"/>
      <stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g clip-path="url(#sq)">
    <!-- sóng tín hiệu phát ra từ vịt -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M 730,240 A 60,60 0 0 1 790,300" stroke-width="26" opacity="0.85"/>
      <path d="M 730,203 A 97,97 0 0 1 827,300" stroke-width="24" opacity="0.55"/>
      <path d="M 730,166 A 134,134 0 0 1 864,300" stroke-width="22" opacity="0.32"/>
    </g>

    <!-- vịt vàng đeo kính (phóng to từ banner) -->
    <g transform="translate(430,430) scale(3.3)">
      <path d="M-62,52 q-20,-16 -12,-34 q16,8 24,22 z" fill="#f0c400"/>
      <ellipse cx="0" cy="60" rx="60" ry="42" fill="#FFD60A"/>
      <ellipse cx="-6" cy="66" rx="26" ry="17" fill="#e9bd00" transform="rotate(-18 -6 66)"/>
      <circle cx="36" cy="0" r="32" fill="#FFD60A"/>
      <path d="M64,-2 q22,4 24,11 q-2,8 -24,11 q6,-11 0,-22 z" fill="#FF9F0A"/>
      <circle cx="40" cy="-6" r="13" fill="#dff3ff" fill-opacity="0.92" stroke="#10131a" stroke-width="3.5"/>
      <line x1="27" y1="-8" x2="14" y2="-12" stroke="#10131a" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="44" cy="-4" r="4.2" fill="#10131a"/>
      <circle cx="52" cy="10" r="5" fill="#ff8fa3" opacity="0.55"/>
    </g>

    <!-- mặt nước 2 lớp -->
    <path d="M100,672 Q 250,630 400,672 T 700,672 T 1000,672 L 1024,924 L 100,924 Z"
          fill="#10205c" opacity="0.55"/>
    <path d="M100,700 Q 280,662 460,700 T 820,700 T 1180,700 L 1024,924 L 100,924 Z"
          fill="#0b1740" opacity="0.45"/>
  </g>
</svg>
