<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Manager 🦆 — nhiều account Signal trên một máy</title>
<meta name="description" content="Chạy nhiều tài khoản Signal Desktop cùng lúc trên macOS. Cài bằng một lệnh.">
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --border:#e2e8f2; --text:#17203a; --muted:#64748b;
    --accent:#3A76F0; --violet:#BF5AF2; --ok:#16a34a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0c0f15; --panel:#151a23; --border:#2a3341; --text:#e9edf2; --muted:#8b96a5; --ok:#32d74b; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px; margin:0 auto; padding:48px 24px 60px; text-align:center}
  .duck{font-size:64px; line-height:1}
  h1{
    font-size:clamp(30px,6vw,44px); font-weight:800; margin:10px 0 6px;
    background:linear-gradient(135deg,var(--accent),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tag{color:var(--muted); font-size:clamp(15px,3vw,19px); max-width:560px; margin:0 auto 26px}
  .langbtn{
    position:fixed; top:14px; right:14px; border:1px solid var(--border); background:var(--panel);
    color:var(--text); border-radius:10px; padding:6px 13px; font-weight:700; cursor:pointer;
  }
  .install{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:24px; margin:0 auto 14px; max-width:720px; text-align:left;
    box-shadow:0 10px 34px rgba(23,32,58,.10);
  }
  .oshead{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .oshead b{font-size:17px}
  .ostab{
    border:1px solid var(--border); background:transparent; color:var(--muted);
    border-radius:999px; padding:5px 14px; font-weight:700; cursor:pointer; font-size:13px;
  }
  .ostab.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .cmdrow{display:flex; gap:10px; align-items:stretch}
  .cmd{
    flex:1; font:13.5px/1.5 ui-monospace,SF Mono,Menlo,Consolas,monospace;
    background:rgba(58,118,240,.07); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; overflow-x:auto; white-space:nowrap; text-align:left;
  }
  .copy{
    border:none; border-radius:12px; padding:0 22px; font-weight:800; font-size:15px;
    background:linear-gradient(135deg,var(--accent),#5b5bf0); color:#fff; cursor:pointer;
    box-shadow:0 6px 18px rgba(58,118,240,.35); transition:.15s; flex:none;
  }
  .copy:hover{filter:brightness(1.1)}
  .copy:active{transform:scale(.96)}
  .note{color:var(--muted); font-size:13.5px; margin-top:12px}
  .shot{width:100%; max-width:820px; border-radius:16px; border:1px solid var(--border);
    box-shadow:0 20px 50px rgba(23,32,58,.16); margin:30px auto 8px}
  .feats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px;
    max-width:820px; margin:26px auto; text-align:left;
  }
  .feat{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:15px 17px}
  .feat b{display:block; margin-bottom:3px}
  .feat span{color:var(--muted); font-size:13.5px}
  footer{color:var(--muted); font-size:13px; margin-top:34px}
  footer a{color:var(--accent); text-decoration:none; font-weight:700}
</style>
</head>
<body>
<button class="langbtn" id="langbtn">EN</button>
<div class="wrap">
  <div class="duck">🦆</div>
  <h1>Signal Manager</h1>
  <p class="tag" id="tag"></p>

  <div class="install">
    <div class="oshead">
      <b id="ihead"></b>
      <button class="ostab" data-os="mac"> macOS</button>
      <button class="ostab" data-os="win">🪟 Windows (beta)</button>
    </div>
    <div class="cmdrow">
      <div class="cmd" id="cmd"></div>
      <button class="copy" id="copy"></button>
    </div>
    <p class="note" id="inote"></p>
  </div>

  <img class="shot" src="https://raw.githubusercontent.com/dev-lo-18tuoi/multi-signal/main/assets/dashboard.png" alt="Signal Manager dashboard"/>

  <div class="feats">
    <div class="feat"><b>🖥 <span id="f1t"></span></b><span id="f1"></span></div>
    <div class="feat"><b>🦆 <span id="f2t"></span></b><span id="f2"></span></div>
    <div class="feat"><b>🛡 <span id="f3t"></span></b><span id="f3"></span></div>
    <div class="feat"><b>🔒 <span id="f4t"></span></b><span id="f4"></span></div>
  </div>

  <footer>
    <a href="https://github.com/dev-lo-18tuoi/multi-signal">GitHub — mã nguồn mở (MIT)</a>
    <div id="disc"></div>
  </footer>
</div>

<script>
'use strict';
const CMDS = {
  mac: "curl -fsSL https://raw.githubusercontent.com/dev-lo-18tuoi/multi-signal/main/install.sh | bash",
  win: "irm https://raw.githubusercontent.com/dev-lo-18tuoi/multi-signal/main/install-windows.ps1 | iex",
};
const L = {
vi: {
  tag: "Chạy 2, 3, 5… tài khoản Signal cùng lúc trên một máy — có bảng điều khiển đẹp, cài bằng một lệnh.",
  head_mac: "Cài trên máy Mac của bạn", head_win: "Cài trên Windows (beta)",
  copy: "Copy", copied: "✓ Đã copy!",
  note_mac: "Mở Terminal (⌘+Space, gõ “Terminal”) → dán lệnh → Enter. Cần cài sẵn Signal Desktop. Mỗi account cần một số điện thoại riêng.",
  note_win: "Mở PowerShell → dán lệnh → Enter. Bản Windows là CLI beta.",
  f1t:"Song song thật sự", f1:"Mỗi account một cửa sổ riêng, chạy cùng lúc, không đụng nhau.",
  f2t:"Menu bar + dashboard", f2:"Điều khiển từ icon vịt trên thanh menu hoặc bảng điều khiển song ngữ.",
  f3t:"Giữ luôn chạy", f3:"Signal tự update làm tắt cửa sổ? Tool tự mở lại trong 45 giây.",
  f4t:"Riêng tư tuyệt đối", f4:"Chạy 100% trong máy bạn, mã nguồn mở, không gửi gì ra ngoài.",
  disc:"Tool không chính thức, không liên quan Signal Messenger LLC.",
},
en: {
  tag: "Run 2, 3, 5… Signal accounts side-by-side on one machine — beautiful dashboard, one-command install.",
  head_mac: "Install on your Mac", head_win: "Install on Windows (beta)",
  copy: "Copy", copied: "✓ Copied!",
  note_mac: "Open Terminal (⌘+Space, type “Terminal”) → paste → Enter. Requires Signal Desktop. Each account needs its own phone number.",
  note_win: "Open PowerShell → paste → Enter. Windows build is a CLI beta.",
  f1t:"Truly parallel", f1:"Each account gets its own window, running side-by-side.",
  f2t:"Menu bar + dashboard", f2:"Control from the duck in your menu bar or the bilingual dashboard.",
  f3t:"Keep alive", f3:"Signal auto-update killed a window? Reopened within 45 seconds.",
  f4t:"Private by design", f4:"Runs 100% on your machine, open source, zero external calls.",
  disc:"Unofficial tool, not affiliated with Signal Messenger LLC.",
},
};
let lang = localStorage.getItem('sml_lang')
  || ((navigator.language || '').toLowerCase().startsWith('vi') ? 'vi' : 'en');
let os = /win/i.test(navigator.platform) || /Windows/i.test(navigator.userAgent) ? 'win' : 'mac';

const $ = s => document.querySelector(s);
function apply(){
  const t = L[lang];
  document.documentElement.lang = lang;
  $('#langbtn').textContent = lang === 'vi' ? 'EN' : 'VI';
  $('#tag').textContent = t.tag;
  $('#ihead').textContent = os === 'mac' ? t.head_mac : t.head_win;
  $('#cmd').textContent = CMDS[os];
  $('#copy').textContent = t.copy;
  $('#inote').textContent = os === 'mac' ? t.note_mac : t.note_win;
  ['f1','f2','f3','f4'].forEach(k => {
    $('#' + k + 't').textContent = t[k + 't'];
    $('#' + k).textContent = t[k];
  });
  $('#disc').textContent = t.disc;
  document.querySelectorAll('.ostab').forEach(b =>
    b.classList.toggle('on', b.dataset.os === os));
}
document.querySelectorAll('.ostab').forEach(b =>
  b.addEventListener('click', () => { os = b.dataset.os; apply(); }));
$('#langbtn').addEventListener('click', () => {
  lang = lang === 'vi' ? 'en' : 'vi';
  localStorage.setItem('sml_lang', lang);
  apply();
});
$('#copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(CMDS[os]); } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = CMDS[os]; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  $('#copy').textContent = L[lang].copied;
  setTimeout(() => { $('#copy').textContent = L[lang].copy; }, 1800);
});
apply();
</script>
</body>
</html>
