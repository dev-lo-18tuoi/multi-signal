# CI kiểm tra cú pháp trên đúng môi trường đích:
# - Windows PowerShell 5.1 parse các file .ps1 (bắt lỗi kiểu BOM/encoding/cú pháp)
# - macOS kiểm bash + python
name: lint
on: [push, pull_request]
jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse ps1 bang Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in 'signal-manager.ps1','install-windows.ps1') {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) {
              $failed = $true
              Write-Host "LOI trong ${f}:"
              $errs | ForEach-Object { Write-Host ("  dong {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            } else { Write-Host "OK: $f" }
          }
          if ($failed) { exit 1 }
  unix-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n signal-manager.sh
          bash -n install.sh
          python3 -m py_compile signal_manager_server.py
          echo "OK: bash + python"
  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: E2E vong doi engine tren Windows that (Signal gia lap)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Signal gia lap: du de qua kiem tra ton tai + Start-Process khong treo
          $sigDir = Join-Path $env:LOCALAPPDATA 'Programs\signal-desktop'
          New-Item -ItemType Directory -Path $sigDir -Force | Out-Null
          Copy-Item "$env:SystemRoot\System32\where.exe" (Join-Path $sigDir 'Signal.exe')

          # cai bang installer LIVE (dung kenh nguoi dung that, co cache-buster)
          irm "https://raw.githubusercontent.com/dev-lo-18tuoi/multi-signal/main/install-windows.ps1?cb=$([DateTime]::UtcNow.Ticks)" | iex
          $cmd = "$env:LOCALAPPDATA\SignalManager\signal-manager.cmd"
          if (-not (Test-Path $cmd)) { throw 'installer khong tao shim' }

          # test dung ban engine cua commit nay (ghi de bang file tu checkout)
          Copy-Item .\signal-manager.ps1 "$env:LOCALAPPDATA\SignalManager\signal-manager.ps1" -Force

          & $cmd help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'help loi' }

          & $cmd add testacc
          if ($LASTEXITCODE -ne 0) { throw 'add loi' }
          if (-not (Test-Path "$env:APPDATA\Signal-testacc")) { throw 'thieu thu muc profile' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Signal testacc.lnk'
          if (-not (Test-Path $lnk)) { throw 'thieu shortcut desktop' }

          $out = & $cmd list | Out-String
          if ($out -notmatch 'testacc') { throw 'list khong thay account' }

          & $cmd autostart testacc on
          $k = Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'SignalManager-testacc' -ErrorAction SilentlyContinue
          if (-not $k) { throw 'autostart khong ghi registry' }
          & $cmd autostart testacc off

          & $cmd remove testacc -Yes
          if ($LASTEXITCODE -ne 0) { throw 'remove loi' }
          if (Test-Path "$env:APPDATA\Signal-testacc") { throw 'remove khong xoa profile' }
          if (Test-Path $lnk) { throw 'remove khong xoa shortcut' }

          Write-Host 'E2E WINDOWS: TAT CA PASS'
